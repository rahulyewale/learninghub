<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part A Unit 1 – Animated Revision | Class 9 ICT</title>
<style>
  :root {
    --blue: #1565c0; --blue-light: #42a5f5; --blue-pale: #e3f2fd;
    --green: #2e7d32; --yellow: #f9a825; --red: #c62828;
    --white: #fff; --dark: #1a1a2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--dark);
    color: var(--white);
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── TOP BAR ── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 54px;
    background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; z-index: 100;
  }
  #topbar .title { font-size: .9rem; opacity: .85; }
  #topbar .controls { display: flex; gap: 10px; align-items: center; }
  #topbar button {
    background: rgba(255,255,255,.15); border: none; color: #fff;
    padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: .8rem;
    transition: background .2s;
  }
  #topbar button:hover { background: rgba(255,255,255,.3); }
  #topbar button.active { background: var(--blue); }
  #slide-info { font-size: .82rem; opacity: .7; }

  /* ── PROGRESS ── */
  #progress-wrap {
    position: fixed; top: 54px; left: 0; right: 0; height: 4px;
    background: rgba(255,255,255,.1); z-index: 100;
  }
  #progress-bar {
    height: 100%; background: linear-gradient(90deg, #42a5f5, #1565c0);
    transition: width .4s ease;
  }

  /* ── CHAPTER DOTS ── */
  #chapter-dots {
    position: fixed; top: 62px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 6px; padding: 6px 0; z-index: 99;
  }
  .ch-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,.25); cursor: pointer; transition: all .2s;
  }
  .ch-dot.active { background: var(--blue-light); transform: scale(1.5); }

  /* ── SLIDE AREA ── */
  #stage {
    position: fixed; top: 94px; bottom: 80px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    perspective: 1200px;
  }
  .slide {
    position: absolute;
    width: min(92vw, 860px);
    background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px;
    padding: 36px 42px;
    backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transform: translateX(80px) scale(.96);
    transition: opacity .45s ease, transform .45s ease;
    max-height: calc(100vh - 180px);
    overflow-y: auto;
  }
  .slide.active {
    opacity: 1; pointer-events: auto;
    transform: translateX(0) scale(1);
  }
  .slide.exit {
    opacity: 0; pointer-events: none;
    transform: translateX(-80px) scale(.96);
  }

  /* ── SLIDE CONTENT ── */
  .slide-tag {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .1em;
    padding: 3px 10px; border-radius: 12px; display: inline-block;
    margin-bottom: 14px; font-weight: 700;
  }
  .tag-ch1 { background: #1565c0; }
  .tag-ch2 { background: #6a1b9a; }
  .tag-ch3 { background: #c62828; }
  .tag-ch4 { background: #2e7d32; }
  .tag-quiz { background: #e65100; }
  .tag-intro { background: #37474f; }

  .slide h2 {
    font-size: 1.75rem; line-height: 1.25; margin-bottom: 16px;
    background: linear-gradient(135deg, #fff, #90caf9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .slide .big-icon { font-size: 3rem; margin-bottom: 12px; display: block; }
  .slide p { font-size: 1rem; line-height: 1.7; opacity: .9; margin-bottom: 12px; }

  .slide ul { padding-left: 0; list-style: none; }
  .slide ul li {
    padding: 8px 0 8px 28px; position: relative;
    font-size: .97rem; border-bottom: 1px solid rgba(255,255,255,.06);
    opacity: 0; animation: fadeUp .5s forwards;
  }
  .slide.active ul li:nth-child(1) { animation-delay: .1s; }
  .slide.active ul li:nth-child(2) { animation-delay: .2s; }
  .slide.active ul li:nth-child(3) { animation-delay: .3s; }
  .slide.active ul li:nth-child(4) { animation-delay: .4s; }
  .slide.active ul li:nth-child(5) { animation-delay: .5s; }
  .slide.active ul li:nth-child(6) { animation-delay: .6s; }
  .slide.active ul li:nth-child(7) { animation-delay: .7s; }
  .slide.active ul li:nth-child(8) { animation-delay: .8s; }
  .slide ul li::before { content: '▶'; position: absolute; left: 6px; color: #42a5f5; font-size: .7rem; top: 12px; }

  .pill {
    display: inline-block; background: rgba(255,255,255,.12);
    border-radius: 6px; padding: 4px 10px; margin: 4px 3px;
    font-size: .88rem; border: 1px solid rgba(255,255,255,.2);
  }
  .pill.blue { background: rgba(66,165,245,.25); border-color: #42a5f5; }
  .pill.green { background: rgba(46,125,50,.35); border-color: #66bb6a; }
  .pill.red { background: rgba(198,40,40,.35); border-color: #ef5350; }
  .pill.purple { background: rgba(106,27,154,.35); border-color: #ab47bc; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  .box {
    background: rgba(255,255,255,.07); border-radius: 10px; padding: 14px;
    border: 1px solid rgba(255,255,255,.1); font-size: .9rem;
  }
  .box h4 { color: #90caf9; margin-bottom: 6px; font-size: .95rem; }

  .cycle-flow {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 8px; margin: 16px 0;
  }
  .cycle-step {
    background: rgba(66,165,245,.2); border: 1px solid #42a5f5;
    border-radius: 8px; padding: 8px 14px; font-size: .88rem; text-align: center;
    min-width: 80px;
  }
  .cycle-arrow { color: #42a5f5; font-size: 1.2rem; }

  /* Quiz */
  .quiz-q { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.5; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-opt {
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.2);
    border-radius: 10px; padding: 12px 18px; cursor: pointer;
    font-size: .95rem; transition: all .2s; text-align: left;
  }
  .quiz-opt:hover { background: rgba(255,255,255,.16); }
  .quiz-opt.correct { background: rgba(46,125,50,.4); border-color: #66bb6a; }
  .quiz-opt.wrong { background: rgba(198,40,40,.4); border-color: #ef5350; }
  .quiz-result { margin-top: 14px; font-size: .95rem; min-height: 24px; }

  /* ── BOTTOM NAV ── */
  #bottomnav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 72px;
    background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  #bottomnav button {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    color: #fff; padding: 10px 22px; border-radius: 24px;
    cursor: pointer; font-size: .9rem; transition: all .2s;
  }
  #bottomnav button:hover { background: rgba(255,255,255,.25); }
  #btn-play {
    background: var(--blue) !important; border-color: var(--blue-light) !important;
    padding: 10px 28px !important;
  }
  #timer-ring {
    width: 36px; height: 36px; position: relative;
  }
  #timer-ring svg { transform: rotate(-90deg); }
  #timer-ring circle {
    fill: none; stroke: #42a5f5; stroke-width: 3;
    stroke-dasharray: 100; stroke-dashoffset: 100;
    transition: stroke-dashoffset 1s linear;
  }

  /* ── NARRATION ── */
  #narration {
    position: fixed; bottom: 76px; left: 0; right: 0;
    text-align: center; font-size: .78rem; opacity: .5;
    padding: 4px 20px; pointer-events: none;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* scrollbar */
  .slide::-webkit-scrollbar { width: 4px; }
  .slide::-webkit-scrollbar-track { background: transparent; }
  .slide::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 2px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="title">🗣️ Part A – Unit 1: Communication Skills | CBSE Class 9 ICT (402) | KIPS</div>
  <div class="controls">
    <span id="slide-info">Slide 1 / 40</span>
    <button id="btn-home" onclick="location.href='../index.html'">🏠 Hub</button>
    <button id="btn-fs" onclick="toggleFS()">⛶ Full</button>
    <button id="btn-autoplay" onclick="toggleAuto()">▶ Auto</button>
  </div>
</div>

<!-- PROGRESS -->
<div id="progress-wrap"><div id="progress-bar" style="width:2.5%"></div></div>

<!-- CHAPTER DOTS -->
<div id="chapter-dots"></div>

<!-- STAGE -->
<div id="stage"></div>

<!-- NARRATION -->
<div id="narration">Use ← → arrow keys or buttons below to navigate</div>

<!-- BOTTOM NAV -->
<div id="bottomnav">
  <button onclick="go(-1)">← Prev</button>
  <div id="timer-ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9"/></svg></div>
  <button id="btn-play" onclick="go(1)">Next →</button>
  <button onclick="go(1)">Skip ▶▶</button>
</div>

<script>
// ═══════════════════════════════════════════════
// SLIDE DATA
// ═══════════════════════════════════════════════
const slides = [
  // ─── INTRO ───
  {tag:'intro', icon:'📚', h:'Welcome to Communication Skills', body:`
    <p>This is your <strong>animated revision session</strong> for <strong>Part A – Unit 1: Communication Skills</strong> from the KIPS Class 9 IT (Code 402) syllabus.</p>
    <p>We will cover all <strong>4 chapters</strong>:</p>
    <ul>
      <li>📘 Chapter 1 – Methods of Communication</li>
      <li>🔄 Chapter 2 – Communication Cycle</li>
      <li>👁️ Chapter 3 – Perspectives in Communication</li>
      <li>✍️ Chapter 4 – Basic Writing Skills</li>
    </ul>
    <p>Click <strong>Next</strong> or press <strong>→</strong> to start. Enable <strong>Auto</strong> for hands-free mode.</p>`, ch:0},

  // ─── CHAPTER 1 ───
  {tag:'ch1', icon:'🗣️', h:'Ch 1 – Methods of Communication', body:`
    <p>Communication is the process of exchanging information, ideas, thoughts or feelings between two or more people.</p>
    <p><strong>Origin:</strong> From Latin <em>communicare</em> = "to share"</p>
    <ul>
      <li>Builds relationships</li>
      <li>Reduces misunderstandings</li>
      <li>Improves teamwork</li>
      <li>Shares information</li>
    </ul>`, ch:1},

  {tag:'ch1', icon:'📊', h:'3 Main Methods of Communication', body:`
    <div class="grid-2">
      <div class="box"><h4>🗣️ Verbal</h4>Uses spoken or written words<br><small>Conversation, letter, email</small></div>
      <div class="box"><h4>🤝 Non-Verbal</h4>No words — body language<br><small>Smile, nod, eye contact</small></div>
      <div class="box"><h4>📊 Visual</h4>Images, charts, signs<br><small>Traffic lights, bar charts</small></div>
      <div class="box"><h4>💡 Key Point</h4>All three methods are often used <strong>together</strong> in real communication</div>
    </div>`, ch:1},

  {tag:'ch1', icon:'🗣️', h:'Verbal: Oral Communication', body:`
    <p>Communication through <strong>spoken words</strong>.</p>
    <ul>
      <li>Face-to-face conversation — immediate feedback</li>
      <li>Telephone / Mobile call — voice only, no visual cues</li>
      <li>Group discussion — multiple speakers, interactive</li>
      <li>Interview — formal question-answer format</li>
      <li>Speech / Presentation — one speaker, large audience</li>
      <li>Video conferencing — Zoom, Google Meet</li>
    </ul>`, ch:1},

  {tag:'ch1', icon:'✍️', h:'Verbal: Written Communication', body:`
    <p>Communication through <strong>written words</strong> — permanent record, can be referred to later.</p>
    <ul>
      <li>Letters — formal and informal</li>
      <li>Email — fast digital written message</li>
      <li>Reports — project and business reports</li>
      <li>Notices — school/office notice boards</li>
      <li>Books and articles</li>
    </ul>
    <div class="box" style="margin-top:12px"><h4>Oral vs Written</h4>
    Oral = immediate, real-time feedback | Written = permanent, delayed feedback</div>`, ch:1},

  {tag:'ch1', icon:'🤝', h:'Non-Verbal Communication', body:`
    <p>Conveys messages <strong>without words</strong>. 55% of communication is non-verbal! (Mehrabian's 7-38-55 rule)</p>
    <ul>
      <li>Facial Expressions — smile = happy, frown = angry</li>
      <li>Eye Contact — confidence and interest</li>
      <li>Gestures — thumbs up = approval</li>
      <li>Posture — straight = confidence, slouch = boredom</li>
      <li>Paralanguage — tone, pitch, volume, speed</li>
      <li>Personal Space — too close = invasion</li>
      <li>Appearance — neat dress = professionalism</li>
    </ul>`, ch:1},

  {tag:'ch1', icon:'📷', h:'Visual Communication', body:`
    <p>Uses <strong>images, symbols, signs and colours</strong> to convey information. Crosses language barriers!</p>
    <ul>
      <li>Traffic Signs — stop sign understood worldwide</li>
      <li>Charts and Graphs — bar chart, pie chart, line graph</li>
      <li>Maps — road maps, weather maps</li>
      <li>Infographics — step-by-step visual guides</li>
      <li>Posters and Advertisements — attract attention</li>
    </ul>`, ch:1},

  {tag:'ch1', icon:'🏢', h:'Formal vs Informal Communication', body:`
    <div class="grid-2">
      <div class="box"><h4>Formal (Official)</h4>
        <ul><li>Official channels</li><li>Professional language</li><li>Documented</li><li>Example: business email</li></ul>
      </div>
      <div class="box"><h4>Informal (Grapevine)</h4>
        <ul><li>Personal channels</li><li>Casual, friendly</li><li>Not documented</li><li>Example: WhatsApp chat</li></ul>
      </div>
    </div>
    <p style="margin-top:12px">Formal direction types: <span class="pill blue">Downward</span> <span class="pill blue">Upward</span> <span class="pill blue">Horizontal</span></p>`, ch:1},

  {tag:'ch1', icon:'🚧', h:'Barriers to Communication', body:`
    <p>Barriers are obstacles that prevent effective communication.</p>
    <ul>
      <li>Physical — noise, distance, poor signal</li>
      <li>Language — jargon, different languages</li>
      <li>Psychological — fear, stress, prejudice</li>
      <li>Cultural — gestures mean different things</li>
      <li>Organisational — too many hierarchy levels</li>
      <li>Perceptual — different interpretation of same message</li>
    </ul>
    <p><strong>Fix:</strong> Simple language + right channel + active listening + feedback</p>`, ch:1},

  {tag:'quiz', icon:'❓', h:'Quick Quiz – Chapter 1', body:`
    <p class="quiz-q">Which type of communication uses body language, gestures and facial expressions without words?</p>
    <div class="quiz-options">
      <button class="quiz-opt" onclick="answer(this,false)">A) Visual Communication</button>
      <button class="quiz-opt" onclick="answer(this,false)">B) Verbal Communication</button>
      <button class="quiz-opt" onclick="answer(this,true)">C) Non-Verbal Communication</button>
      <button class="quiz-opt" onclick="answer(this,false)">D) Written Communication</button>
    </div>
    <div class="quiz-result" id="qr"></div>`, ch:1},

  // ─── CHAPTER 2 ───
  {tag:'ch2', icon:'🔄', h:'Ch 2 – The Communication Cycle', body:`
    <p>The Communication Cycle describes the <strong>complete process</strong> of communication — from the sender forming an idea to the receiver's feedback reaching back to the sender.</p>
    <p>Developed by <strong>Shannon and Weaver (1948)</strong></p>
    <p>It is a <strong>continuous, two-way process</strong> — not just one-way.</p>`, ch:2},

  {tag:'ch2', icon:'🔢', h:'8 Elements of the Communication Cycle', body:`
    <ul>
      <li>1️⃣ Sender — person who starts the communication</li>
      <li>2️⃣ Message / Idea — information to be communicated</li>
      <li>3️⃣ Encoding — converting idea into words/symbols</li>
      <li>4️⃣ Channel — medium (voice, email, letter)</li>
      <li>5️⃣ Receiver — person who gets the message</li>
      <li>6️⃣ Decoding — receiver interprets the message</li>
      <li>7️⃣ Feedback — receiver's response back to sender</li>
      <li>8️⃣ Noise — any interference/barrier</li>
    </ul>`, ch:2},

  {tag:'ch2', icon:'➡️', h:'The Cycle — Visualised', body:`
    <div class="cycle-flow">
      <div class="cycle-step">Sender</div><span class="cycle-arrow">→</span>
      <div class="cycle-step">Encoding</div><span class="cycle-arrow">→</span>
      <div class="cycle-step">Channel</div><span class="cycle-arrow">→</span>
      <div class="cycle-step">Receiver</div>
    </div>
    <div class="cycle-flow">
      <div class="cycle-step">Feedback</div><span class="cycle-arrow">←</span>
      <div class="cycle-step">Decoding</div>
    </div>
    <div class="box" style="margin-top:14px"><h4>🔑 Key Difference</h4>
    Encoding = SENDER converts idea → message<br>
    Decoding = RECEIVER interprets message<br>
    If decoding ≠ encoding → miscommunication!</div>`, ch:2},

  {tag:'ch2', icon:'💬', h:'Types of Feedback', body:`
    <div class="grid-2">
      <div class="box"><h4>✅ Positive</h4>Message understood correctly — "Yes, I get it!"</div>
      <div class="box"><h4>❌ Negative</h4>Not understood — "I'm confused"</div>
      <div class="box"><h4>🗣️ Verbal</h4>Words — questions, answers</div>
      <div class="box"><h4>🤝 Non-Verbal</h4>Nod, smile, frown</div>
      <div class="box"><h4>⚡ Immediate</h4>Real-time — during phone call</div>
      <div class="box"><h4>⏱️ Delayed</h4>After a gap — email reply</div>
    </div>
    <p style="margin-top:12px">Without feedback, communication is <strong>one-way and incomplete</strong>.</p>`, ch:2},

  {tag:'ch2', icon:'🔇', h:'Noise — Types of Interference', body:`
    <p>Noise = any interference that distorts the message</p>
    <ul>
      <li>Physical — loud music, traffic, poor signal</li>
      <li>Semantic — wrong words, jargon, ambiguity</li>
      <li>Psychological — stress, bias, daydreaming</li>
      <li>Physiological — illness, tiredness, hearing problem</li>
    </ul>
    <p><strong>Noise is NOT just sound</strong> — it is any barrier at any stage of the cycle!</p>`, ch:2},

  {tag:'ch2', icon:'7️⃣', h:'The 7 C\'s of Effective Communication', body:`
    <ul>
      <li><strong>Clear</strong> — easy to understand; use simple language</li>
      <li><strong>Concise</strong> — brief; no unnecessary words</li>
      <li><strong>Correct</strong> — accurate facts and grammar</li>
      <li><strong>Complete</strong> — include all necessary information</li>
      <li><strong>Courteous</strong> — polite and respectful</li>
      <li><strong>Coherent</strong> — logically ordered</li>
      <li><strong>Concrete</strong> — specific facts, not vague</li>
    </ul>
    <p><strong>Memory trick:</strong> "Clear Concise Correct Complete Courteous Coherent Concrete"</p>`, ch:2},

  {tag:'ch2', icon:'👂', h:'Hearing vs Active Listening', body:`
    <div class="grid-2">
      <div class="box"><h4>🔊 Hearing (Passive)</h4>
        <ul><li>Automatic</li><li>Physical process</li><li>No understanding needed</li><li>Happens without effort</li></ul>
      </div>
      <div class="box"><h4>👂 Active Listening</h4>
        <ul><li>Deliberate effort</li><li>Mental process</li><li>Full understanding required</li><li>Requires concentration</li></ul>
      </div>
    </div>
    <p style="margin-top:12px">Tips: maintain eye contact, don't interrupt, ask questions, paraphrase to confirm</p>`, ch:2},

  {tag:'quiz', icon:'❓', h:'Quick Quiz – Chapter 2', body:`
    <p class="quiz-q">The 7 C's of effective communication include all EXCEPT which one?</p>
    <div class="quiz-options">
      <button class="quiz-opt" onclick="answer(this,false)">A) Concise</button>
      <button class="quiz-opt" onclick="answer(this,false)">B) Coherent</button>
      <button class="quiz-opt" onclick="answer(this,true)">C) Complicated</button>
      <button class="quiz-opt" onclick="answer(this,false)">D) Courteous</button>
    </div>
    <div class="quiz-result" id="qr"></div>`, ch:2},

  // ─── CHAPTER 3 ───
  {tag:'ch3', icon:'👁️', h:'Ch 3 – Perspectives in Communication', body:`
    <p><strong>Perception</strong> = how a person interprets the world based on their senses, experience and beliefs.</p>
    <p>Two people can receive the <strong>same message</strong> but understand it very differently.</p>
    <p>Example: A glass of water — "half full" vs "half empty" — same situation, different perspectives!</p>
    <p>Misperception is one of the biggest causes of communication breakdown.</p>`, ch:3},

  {tag:'ch3', icon:'🔍', h:'8 Factors that Affect Communication', body:`
    <ul>
      <li>Visual Perception — what we see influences interpretation</li>
      <li>Language and Vocabulary — common language required</li>
      <li>Past Experience — prior knowledge shapes understanding</li>
      <li>Prejudices / Biases — pre-formed opinions distort reception</li>
      <li>Feelings and Emotions — emotional state affects message</li>
      <li>Environment — noisy classroom vs quiet room</li>
      <li>Culture — different norms for eye contact, gestures</li>
      <li>Gender — different communication styles</li>
    </ul>`, ch:3},

  {tag:'ch3', icon:'📖', h:'8 Parts of Speech', body:`
    <div class="grid-2">
      <div class="box"><h4>Noun</h4>Names a person/place/thing<br><em>Rahul, school</em></div>
      <div class="box"><h4>Pronoun</h4>Replaces a noun<br><em>he, she, it, they</em></div>
      <div class="box"><h4>Verb</h4>Action or state of being<br><em>run, write, is</em></div>
      <div class="box"><h4>Adjective</h4>Describes a noun<br><em>tall, red, happy</em></div>
      <div class="box"><h4>Adverb</h4>Describes a verb/adjective<br><em>quickly, very, often</em></div>
      <div class="box"><h4>Preposition</h4>Shows relationship<br><em>in, on, at, under</em></div>
      <div class="box"><h4>Conjunction</h4>Joins words/clauses<br><em>and, but, or, because</em></div>
      <div class="box"><h4>Interjection</h4>Expresses emotion<br><em>Wow!, Ouch!, Great!</em></div>
    </div>`, ch:3},

  {tag:'ch3', icon:'💬', h:'4 Kinds of Sentences', body:`
    <div class="grid-2">
      <div class="box"><h4>Declarative</h4>States a fact<br><em>"She is a good student."</em></div>
      <div class="box"><h4>Interrogative</h4>Asks a question<br><em>"Where is the library?"</em></div>
      <div class="box"><h4>Imperative</h4>Gives a command<br><em>"Open your books."</em></div>
      <div class="box"><h4>Exclamatory</h4>Expresses strong emotion<br><em>"What a great answer!"</em></div>
    </div>`, ch:3},

  {tag:'ch3', icon:'🌍', h:'Cultural Perspectives', body:`
    <p>Different cultures communicate differently — being aware prevents offence!</p>
    <ul>
      <li>Eye Contact — respect (Western) vs disrespect (some Asian)</li>
      <li>Handshake vs Namaste — cultural greetings differ</li>
      <li>Silence — agreement in some cultures; discomfort in others</li>
      <li>Directness — blunt (Germany) vs indirect/polite (Japan)</li>
      <li>Punctuality — critical (UK/USA) vs flexible (some cultures)</li>
    </ul>
    <p><strong>In IT-ITeS:</strong> Indian professionals often work with US/UK/EU clients — cultural awareness is essential!</p>`, ch:3},

  {tag:'ch3', icon:'💪', h:'Assertive vs Aggressive vs Passive', body:`
    <ul>
      <li><strong>Assertive ✅ (IDEAL)</strong> — clear, confident and respectful<br><em>"I disagree because…"</em></li>
      <li><strong>Aggressive ❌</strong> — forceful, no regard for others<br><em>"You're wrong. Period."</em></li>
      <li><strong>Passive ⚠️</strong> — avoids expressing needs<br><em>"Whatever you say…"</em></li>
      <li><strong>Passive-Aggressive ❌</strong> — indirect negative expression<br><em>Silent treatment, sarcasm</em></li>
    </ul>
    <p><strong>Use assertive communication</strong> in all professional settings!</p>`, ch:3},

  {tag:'quiz', icon:'❓', h:'Quick Quiz – Chapter 3', body:`
    <p class="quiz-q">Which part of speech expresses emotion? Example: "Wow!", "Ouch!"</p>
    <div class="quiz-options">
      <button class="quiz-opt" onclick="answer(this,false)">A) Conjunction</button>
      <button class="quiz-opt" onclick="answer(this,false)">B) Adverb</button>
      <button class="quiz-opt" onclick="answer(this,false)">C) Preposition</button>
      <button class="quiz-opt" onclick="answer(this,true)">D) Interjection</button>
    </div>
    <div class="quiz-result" id="qr"></div>`, ch:3},

  // ─── CHAPTER 4 ───
  {tag:'ch4', icon:'✍️', h:'Ch 4 – Basic Writing Skills', body:`
    <p>Writing skills are the ability to express ideas clearly in written form. In IT-ITeS, used daily for emails, reports, documentation and client communication.</p>
    <p><strong>Qualities of Good Writing:</strong></p>
    <ul>
      <li>Clarity — easy to understand</li>
      <li>Conciseness — no unnecessary words</li>
      <li>Accuracy — correct facts and grammar</li>
      <li>Coherence — ideas flow logically</li>
      <li>Appropriate tone — formal or informal as needed</li>
    </ul>`, ch:4},

  {tag:'ch4', icon:'📝', h:'The 5-Stage Writing Process', body:`
    <div class="cycle-flow">
      <div class="cycle-step">Pre-Writing<br><small>Plan & brainstorm</small></div>
      <span class="cycle-arrow">→</span>
      <div class="cycle-step">Drafting<br><small>Write first version</small></div>
      <span class="cycle-arrow">→</span>
      <div class="cycle-step">Revising<br><small>Improve content</small></div>
      <span class="cycle-arrow">→</span>
      <div class="cycle-step">Editing<br><small>Fix errors</small></div>
      <span class="cycle-arrow">→</span>
      <div class="cycle-step">Publishing<br><small>Send / share</small></div>
    </div>
    <p>Never skip pre-writing — planning saves time and improves quality!</p>`, ch:4},

  {tag:'ch4', icon:'📄', h:'Paragraph Structure', body:`
    <div class="grid-2">
      <div class="box"><h4>1. Topic Sentence</h4>States the main idea — usually the FIRST sentence</div>
      <div class="box"><h4>2. Supporting Sentences</h4>Details, examples and reasons — 3 to 5 sentences</div>
      <div class="box"><h4>3. Concluding Sentence</h4>Wraps up the paragraph — usually the LAST sentence</div>
      <div class="box"><h4>Golden Rule</h4>One paragraph = ONE idea. Never mix two unrelated topics!</div>
    </div>`, ch:4},

  {tag:'ch4', icon:'📬', h:'Formal Letter – 8 Parts', body:`
    <ul>
      <li>1. Sender's Address — top of the letter</li>
      <li>2. Date — below sender's address</li>
      <li>3. Receiver's Address — name and address of recipient</li>
      <li>4. Salutation — Dear Sir / Dear Ms. [Name]</li>
      <li>5. Subject Line — brief title of the letter</li>
      <li>6. Body — opening + main + closing paragraphs</li>
      <li>7. Closing — Yours sincerely / Yours faithfully</li>
      <li>8. Signature — handwritten + printed name</li>
    </ul>
    <p><strong>Yours sincerely</strong> = when name is known | <strong>Yours faithfully</strong> = Dear Sir/Madam</p>`, ch:4},

  {tag:'ch4', icon:'📋', h:'Notice Writing – Format and 5 W\'s', body:`
    <p>A notice is a short official announcement on a notice board.</p>
    <p><strong>Format:</strong></p>
    <ul>
      <li>1. Organisation/School Name</li>
      <li>2. NOTICE (centred, in capitals)</li>
      <li>3. Date</li>
      <li>4. Heading / Title</li>
      <li>5. Body — cover the 5 W's</li>
      <li>6. Signature and designation</li>
    </ul>
    <p><strong>5 W's:</strong> <span class="pill blue">Who</span><span class="pill blue">What</span><span class="pill blue">When</span><span class="pill blue">Where</span><span class="pill blue">Why</span></p>`, ch:4},

  {tag:'ch4', icon:'📧', h:'Professional Email Structure', body:`
    <ul>
      <li><strong>Subject:</strong> Short and specific (not vague)</li>
      <li><strong>Salutation:</strong> Dear Mr./Ms. [Name]</li>
      <li><strong>Opening:</strong> State purpose immediately</li>
      <li><strong>Body:</strong> One idea per paragraph, clear and concise</li>
      <li><strong>Call to Action:</strong> What you need them to do</li>
      <li><strong>Closing:</strong> Best regards / Warm regards</li>
      <li><strong>Signature:</strong> Name, designation, phone</li>
    </ul>
    <p>❌ Don't use ALL CAPS | ❌ No slang (LOL, BRB) | ✅ Proofread before sending</p>`, ch:4},

  {tag:'quiz', icon:'❓', h:'Quick Quiz – Chapter 4', body:`
    <p class="quiz-q">When writing a formal letter to "Dear Sir/Madam" (recipient's name unknown), which closing should you use?</p>
    <div class="quiz-options">
      <button class="quiz-opt" onclick="answer(this,false)">A) Yours sincerely</button>
      <button class="quiz-opt" onclick="answer(this,true)">B) Yours faithfully</button>
      <button class="quiz-opt" onclick="answer(this,false)">C) With love</button>
      <button class="quiz-opt" onclick="answer(this,false)">D) Best regards</button>
    </div>
    <div class="quiz-result" id="qr"></div>`, ch:4},

  // ─── FINAL REVIEW ───
  {tag:'intro', icon:'🏆', h:'Master Quick-Revision', body:`

// ═══════════════════════════════════════════════
// PLAYER LOGIC
// ═══════════════════════════════════════════════
let cur = 0, autoplay = false, timer = null, timerSec = 0;
const AUTOSEC = 10;
const CHAPTERS = ['Intro', 'Ch1 Methods', 'Ch2 Cycle', 'Ch3 Perspectives', 'Ch4 Writing'];
const TAG_CLASS = {intro:'tag-intro', ch1:'tag-ch1', ch2:'tag-ch2', ch3:'tag-ch3', ch4:'tag-ch4', quiz:'tag-quiz'};

function buildDots() {
  const wrap = document.getElementById('chapter-dots');
  CHAPTERS.forEach((name, i) => {
    const d = document.createElement('div');
    d.className = 'ch-dot'; d.title = name;
    d.onclick = () => jumpToChapter(i);
    wrap.appendChild(d);
  });
}

function jumpToChapter(ch) {
  const idx = slides.findIndex(s => s.ch === ch);
  if (idx >= 0) { cur = idx; render(); }
}

function render() {
  const stage = document.getElementById('stage');
  // remove old
  stage.querySelectorAll('.slide.exit').forEach(el => el.remove());
  const old = stage.querySelector('.slide.active');
  if (old) { old.classList.remove('active'); old.classList.add('exit'); setTimeout(() => old.remove(), 500); }

  const s = slides[cur];
  const el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = `
    <span class="slide-tag ${TAG_CLASS[s.tag]||'tag-intro'}">${s.tag.toUpperCase()}</span>
    <span class="big-icon">${s.icon}</span>
    <h2>${s.h}</h2>
    ${s.body}
  `;
  stage.appendChild(el);
  requestAnimationFrame(() => el.classList.add('active'));

  // progress
  const pct = ((cur+1)/slides.length*100).toFixed(1);
  document.getElementById('progress-bar').style.width = pct+'%';
  document.getElementById('slide-info').textContent = `Slide ${cur+1} / ${slides.length}`;

  // dots
  document.querySelectorAll('.ch-dot').forEach((d,i) => d.classList.toggle('active', i===s.ch));

  // narration
  const narr = document.getElementById('narration');
  narr.textContent = cur===0
    ? 'Use ← → arrow keys or buttons below to navigate'
    : `Slide ${cur+1} of ${slides.length} — ${CHAPTERS[s.ch]||''}`;

  resetTimer();
}

function go(dir) {
  const next = cur + dir;
  if (next < 0 || next >= slides.length) return;
  cur = next; render();
}

function toggleAuto() {
  autoplay = !autoplay;
  const btn = document.getElementById('btn-autoplay');
  btn.classList.toggle('active', autoplay);
  btn.textContent = autoplay ? '⏸ Pause' : '▶ Auto';
  if (autoplay) tickTimer(); else clearInterval(timer);
}

function resetTimer() {
  clearInterval(timer);
  timerSec = 0;
  updateRing(0);
  if (autoplay) tickTimer();
}

function tickTimer() {
  timer = setInterval(() => {
    timerSec++;
    const pct = timerSec / AUTOSEC;
    updateRing(pct);
    if (timerSec >= AUTOSEC) {
      clearInterval(timer);
      if (cur < slides.length - 1) { go(1); }
      else { toggleAuto(); }
    }
  }, 1000);
}

function updateRing(pct) {
  const c = document.querySelector('#timer-ring circle');
  if (c) c.style.strokeDashoffset = (100 - pct*100).toString();
}

function answer(btn, correct) {
  const opts = btn.parentElement.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.disabled = true);
  btn.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) opts.forEach(o => { if (o.onclick.toString().includes('true')) o.classList.add('correct'); });
  const res = btn.closest('.slide').querySelector('#qr');
  if (res) res.innerHTML = correct
    ? '<span style="color:#66bb6a">✅ Correct! Well done!</span>'
    : '<span style="color:#ef5350">❌ Wrong — highlighted in green is the correct answer.</span>';
}

function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
});

buildDots();
render();
</script>
